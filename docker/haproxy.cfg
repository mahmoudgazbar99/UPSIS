global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend http_or_https
    bind :8443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend apache_https if { req.ssl_hello_type 1 }
    default_backend apache_http

backend apache_https
    server apache_tls web:443 check resolvers docker init-addr libc,none

backend apache_http
    server apache_http web:80 check resolvers docker init-addr libc,none
